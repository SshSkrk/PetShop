<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Products - Pet Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <style>
        body {
            background-color: #f5faff;
            font-family: 'Segoe UI', sans-serif;
        }
        .navbar {
            background-color: #e3f2fd !important;
        }
        .product-card {
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s ease-in-out;
        }
        .product-card:hover {
            transform: translateY(-5px);
        }
        .card-img-top {
            height: 180px;
            object-fit: cover;
        }
        .btn-outline-secondary {
            border-color: #74c0fc;
            color: #0077b6;
        }
        .btn-outline-secondary:hover {
            background-color: #d0ebff;
            color: #005fa3;
        }
        .btn-outline-primary {
            border-color: #91d5ff;
        }
        .btn-outline-primary:hover {
            background-color: #bae0ff;
        }
        .btn-outline-dark:hover {
            background-color: #dee2e6;
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-light bg-warning-subtle px-4">
    <a class="navbar-brand fw-bold" href="index.html">🐾 Pet Shop</a>
    <div class="ms-auto">
        <a href="cart.html" class="btn btn-outline-dark">🛒 Cart</a>
    </div>
</nav>

<!-- Product List -->
<div class="container mt-4">
    <h2 class="mb-4">Available Products</h2>
    <div id="product-list" class="row g-4"></div>
</div>

<script>
    let currentUser = null;

    async function getCurrentUser() {
        try {
            const res = await fetch('/api/current-user', { credentials: 'include' });
            if (!res.ok) return null;
            return await res.json();
        } catch (err) {
            console.error("Session check failed:", err);
            return null;
        }
    }

    document.addEventListener('DOMContentLoaded', async () => {
        currentUser = await getCurrentUser();
        const cartKey = currentUser?.username ? `cartItems_${currentUser.username}` : null;

        const res = await fetch('/api/ListOfAllProducts');
        const products = await res.json();

        const container = document.getElementById('product-list');
        container.innerHTML = '';

        products.forEach(product => {
            const col = document.createElement('div');
            col.className = 'col-md-4';

            const card = document.createElement('div');
            card.className = 'card product-card';

            const img = document.createElement('img');
            img.className = 'card-img-top';
            img.src = product.imagePath && product.imagePath.trim() !== ''
                ? product.imagePath
                : 'https://placehold.co/300x180?text=No+Image';
            img.alt = product.name || 'Product image';

            const body = document.createElement('div');
            body.className = 'card-body';

            const title = document.createElement('h5');
            title.className = 'card-title';
            title.textContent = product.name;

            const price = document.createElement('p');
            price.className = 'card-text fw-bold';
            price.textContent = `€${product.price.toFixed(2)}`;

            const quantityInput = document.createElement('input');
            quantityInput.type = 'number';
            quantityInput.min = 1;
            quantityInput.value = 1;
            quantityInput.className = 'form-control mb-2';
            quantityInput.style.width = '100%';

            const button = document.createElement('button');
            button.className = 'btn btn-success w-100';
            button.textContent = 'Add to Cart';


            button.addEventListener('click', () => {
                if (!currentUser || !currentUser.username) {
                    alert("🔐 Please log in to add items to your cart.");
                    window.location.href = "login.html";
                    return;
                }

                const key = `cartItems_${currentUser.username}`;
                const cart = JSON.parse(sessionStorage.getItem(key) || '[]');
                const existing = cart.find(p => p.id === product.id);

                if (existing) {
                    existing.quantity += 1;
                } else {
                    cart.push({
                        id: product.id,
                        name: product.name,
                        price: product.price,
                        quantity: 1,
                        imagePath: product.imagePath || ''
                    });
                }

                sessionStorage.setItem(key, JSON.stringify(cart));
                alert(`🛒 ${product.name} added to cart!`);
            });

            body.append(title, price, button);
            card.append(img, body);
            col.appendChild(card);
            container.appendChild(col);
        });
    });
</script>

</body>
</html>
