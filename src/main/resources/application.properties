# Use Heroku-provided DATABASE_URL for PostgreSQL
spring.datasource.url=${JDBC_DATABASE_URL}
spring.datasource.username=${JDBC_DATABASE_USERNAME}
spring.datasource.password=${JDBC_DATABASE_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Automatically create schema - you might want 'update' or 'validate' in production
spring.jpa.hibernate.ddl-auto=create

# Show SQL logs (optional, good for debugging)
# spring.jpa.show-sql=true
# spring.jpa.properties.hibernate.format_sql=true

# Heroku provides the port via environment variable
server.port=${PORT:8080}









